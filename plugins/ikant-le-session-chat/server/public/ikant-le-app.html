<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font-family:ui-sans-serif,system-ui,sans-serif;color-scheme:light dark}body{margin:0;padding:14px}#shell{display:grid;gap:10px}#terms,#out{white-space:pre-wrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent);padding:10px;border-radius:9px}#terms{max-height:220px;overflow:auto;font-size:12px}.row{display:flex;gap:8px}.row input{flex:1}input,button{font:inherit;padding:9px;border-radius:8px;border:1px solid color-mix(in srgb,currentColor 30%,transparent)}.hidden{display:none!important}</style></head><body><div id="shell"><div id="status">Opening iKant_LE…</div><section id="accept" class="hidden"><div id="terms"></div><div class="row"><input id="acceptInput" placeholder="Type exactly: I ACCEPT"><button id="acceptBtn">Accept</button></div></section><pre id="out" class="hidden"></pre><div id="composer" class="row hidden"><input id="input" placeholder="Message iKant_LE"><button id="send">Send</button></div></div>
<script type="module">
const $=x=>document.getElementById(x),status=$('status'),accept=$('accept'),terms=$('terms'),acceptInput=$('acceptInput'),acceptBtn=$('acceptBtn'),out=$('out'),composer=$('composer'),input=$('input'),send=$('send');let id=0,pending=new Map(),latest=null;
const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');const request=(method,params)=>new Promise((resolve,reject)=>{const i=++id;pending.set(i,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id:i,method,params},'*');});
const meta=()=>window.openai?.toolResponseMetadata?.mcp_tool_result?._meta||window.openai?.toolResponseMetadata?._meta||{};const payload=r=>r?._meta?.ikant_le||r?.mcp_tool_result?._meta?.ikant_le||meta()?.ikant_le||latest;
async function call(name,args){return request('tools/call',{name,arguments:args});}
async function update(r){const p=payload(r);if(!p)return;latest=p;if(p.terms_text){terms.textContent=p.terms_text;accept.classList.toggle('hidden',p.acceptance_required===false);status.textContent=p.active?'ACTIVE':'Terms ready';}if(p.state==='ACTIVE'||p.active===true){accept.classList.add('hidden');composer.classList.remove('hidden');status.textContent='ACTIVE';}if(p.stdout){out.textContent=p.stdout;out.classList.remove('hidden');}}
window.addEventListener('message',async e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(typeof m.id==='number'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result')try{await update(m.params);}catch(err){status.textContent='Blocked: '+String(err?.message||err);}}, {passive:true});
acceptBtn.addEventListener('click',async()=>{acceptBtn.disabled=true;try{await update(await call('ikant_le_accept',{human_input:acceptInput.value}));}catch(e){status.textContent='Acceptance blocked: '+String(e?.message||e);}finally{acceptBtn.disabled=false;}});
async function sendTurn(){const text=input.value.trim();if(!text)return;send.disabled=input.disabled=true;try{await update(await call('ikant_le_turn',{input:text}));input.value='';}catch(e){status.textContent='Turn blocked: '+String(e?.message||e);}finally{send.disabled=input.disabled=false;}}
send.addEventListener('click',sendTurn);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendTurn();}});
async function init(){await request('ui/initialize',{appInfo:{name:'ikant-le-session-chat',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{});await update(window.openai?.toolResponseMetadata?.mcp_tool_result||{_meta:meta()});}init().catch(e=>status.textContent='iKant_LE bridge unavailable: '+String(e?.message||e));
</script></body></html>
