name: C52 bootstrap materializer
on:
  push:
    branches: [c52/physical-runtime-closure-v1]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c52/physical-runtime-closure-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic Python dependency
        run: python -m pip install numpy==2.1.2
      - name: Materialize staged source payload
        run: |
          cat .c52/payload.* | base64 -d > /tmp/c52_payload.tgz
          tar -xzf /tmp/c52_payload.tgz -C .
      - name: Reblob canonical runtime root
        run: npm run runtime-root:regen
      - name: Regenerate inherited C51 evidence after bootstrap fix
        run: |
          node scripts/c51-supersystem-select-10m.mjs --cases 10000000
          node scripts/c51-supersystem-falsify-1m.mjs --cases 1000000
          node scripts/c51-build-dod.mjs
      - name: C52 ten-million saturation and full lattice
        run: python scripts/c52-physical-closure-saturate.py
      - name: Bundle coverage
        run: node scripts/c52-bundle-coverage.mjs
      - name: Build granular C52 DoD
        run: node scripts/c52-build-dod.mjs
      - name: Verify exact generated runtime
        run: npm run runtime-root:verify
      - name: Focused inherited and C52 tests
        run: node --test --test-concurrency=1 tests/c33-post-187-closure.test.mjs tests/c34-pre-runtime-handoff.test.mjs tests/c46-coldstart-cohost-bind.test.mjs tests/c50-native-transcript-participant.test.mjs tests/c51-supersystem-runtime-conformance.test.mjs tests/c52-physical-runtime-closure.test.mjs
      - name: Repository contract check
        run: npm run check
      - name: Commit exact generated bytes and clean staging
        run: |
          rm -rf .c52
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C52: [materialized] close physical runtime proof surface"
          git push origin HEAD:c52/physical-runtime-closure-v1
