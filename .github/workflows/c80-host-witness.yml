name: C80 Host Witness & H95 Qualification
on:
  pull_request:
    paths:
      - 'host/c80-*'
      - 'scripts/c80-*'
      - 'tests/c80-*'
      - 'contracts/c80-*'
      - 'docs/C80_*'
      - '.github/workflows/c80-host-witness.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-field-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Execute C80 cryptographic and 2000 mutation tests (TEST KEYS ARE FIXTURES)
        run: node --test --test-concurrency=1 tests/c80-field-witness.test.mjs
      - name: Regression - real C78 and C79 computation
        run: node --test --test-concurrency=1 tests/c79-native-chat-surface.test.mjs
      - run: npm run runtime-root:verify
      - run: npm run check
