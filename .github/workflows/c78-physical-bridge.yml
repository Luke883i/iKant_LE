name: C78 bounded opaque GitHub-to-Node relay
on:
  pull_request:
    paths:
      - 'host/c78-*'
      - 'scripts/c78-*'
      - 'tests/c78-*'
      - 'contracts/c78-*'
      - 'docs/C78_*'
      - '.github/workflows/c78-physical-bridge.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Execute C78 physical byte relay and 160 mutations
        run: node --test --test-concurrency=1 tests/c78-host-relay.test.mjs
      - name: C77 original capsule regression
        run: node --test --test-concurrency=1 tests/c77-standalone-capsule.test.mjs
      - run: npm run runtime-root:verify
      - run: npm run check
