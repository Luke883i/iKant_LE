name: c17-deadline-integrity
on:
  push:
    branches:
      - 'agent/c17-deadline-integrity'
  pull_request:
    paths:
      - 'src/deadline-integrity.mjs'
      - 'src/bootstrap-semantic.mjs'
      - 'src/runtime-core.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime-availability.mjs'
      - 'src/state.mjs'
      - 'src/admission.mjs'
      - 'contracts/deadline-integrity.json'
      - 'contracts/chat-bootstrap-semantic.json'
      - 'contracts/runtime-availability-dod.json'
      - 'scripts/c17-deadline-integrity-falsify.mjs'
      - 'tests/c17-deadline-integrity.test.mjs'
      - 'runtime-root/**'
      - 'BOOTSTRAP.json'
      - 'package.json'
      - 'scripts/check.mjs'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run falsify:c17
