name: c30-session-shell-prepr
on:
  push:
    branches: ['c30/deterministic-session-shell-prepr']
  pull_request:
    paths:
      - 'src/contract.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime-turn.mjs'
      - 'src/surface-b.mjs'
      - 'contracts/host-shell.json'
      - 'contracts/ikant-le.json'
      - 'contracts/surface-b-delivery.json'
      - 'runtime-root/**'
      - 'BOOTSTRAP.json'
      - 'tests/c30-session-shell.test.mjs'
      - 'scripts/c30-session-shell-*.mjs'
permissions:
  contents: read
  checks: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run runtime-root:verify
      - run: node --test --test-concurrency=1 tests/c30-session-shell.test.mjs
      - run: npm run select:c30
      - run: npm run falsify:c30
      - name: Run full regression with capture
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Publish regression diagnostic
        if: steps.regression.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/npm-test.log','utf8').slice(-50000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'c30-regression-diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: { title: 'npm test regression tail', summary: 'C30 pre-PR regression details', text: body }
            });
      - name: Fail on regression
        if: steps.regression.outputs.code != '0'
        run: exit 1
