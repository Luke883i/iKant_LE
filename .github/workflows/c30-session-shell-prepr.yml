name: c30-session-shell-prepr
on:
  push:
    branches: ['c30/deterministic-session-shell-prepr']
  pull_request:
    paths:
      - 'src/contract.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime-turn.mjs'
      - 'src/surface-b.mjs'
      - 'contracts/host-shell.json'
      - 'contracts/ikant-le.json'
      - 'contracts/surface-b-delivery.json'
      - 'runtime-root/**'
      - 'BOOTSTRAP.json'
      - 'tests/c30-session-shell.test.mjs'
      - 'scripts/c30-session-shell-*.mjs'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run runtime-root:verify
      - run: node --test --test-concurrency=1 tests/c30-session-shell.test.mjs
      - run: npm run select:c30
      - run: npm run falsify:c30
      - name: Run full regression with summary\n        shell: bash\n        run: |\n          set +e\n          npm test > /tmp/npm-test.log 2>&1\n          code=$?\n          echo '### npm test tail' >> \"$GITHUB_STEP_SUMMARY\"\n          tail -n 220 /tmp/npm-test.log >> \"$GITHUB_STEP_SUMMARY\"\n          exit $code\n