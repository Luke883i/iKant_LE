name: C81 Git object source reachability
on:
  pull_request:
    paths:
      - 'host/c81-*'
      - 'scripts/c81-*'
      - 'tests/c81-*'
      - 'contracts/c81-*'
      - 'docs/C81_*'
      - '.github/workflows/c81-git-reachability.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c81-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: C81 real Git object checkout/manifest proof and 1000 mutations
        run: node --test --test-concurrency=1 tests/c81-source-reachability.test.mjs
      - name: C77/C78/C79/C80 regressions
        run: node --test --test-concurrency=1 tests/c77-standalone-capsule.test.mjs tests/c78-host-relay.test.mjs tests/c79-native-chat-surface.test.mjs tests/c80-field-witness.test.mjs
      - run: npm run runtime-root:verify
      - run: npm run check
