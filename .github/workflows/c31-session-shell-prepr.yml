name: c31-session-shell-prepr
on:
  push:
    branches: ['c31/deterministic-session-shell-prepr']
  pull_request:
    paths:
      - 'src/session-shell.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime-turn.mjs'
      - 'src/runtime-limited-turn.mjs'
      - 'src/runtime.mjs'
      - 'contracts/session-shell.json'
      - 'runtime-root/**'
      - 'BOOTSTRAP.json'
      - 'tests/c31-session-shell.test.mjs'
      - 'scripts/c31-session-shell-*.mjs'
permissions:
  contents: read
  checks: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run runtime-root:verify
      - run: node --test --test-concurrency=1 tests/c31-session-shell.test.mjs tests/c30-activation-service.test.mjs
      - run: npm run select:c31
      - run: npm run falsify:c31
      - name: Run full regression with capture
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > /tmp/c31-npm-test.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Publish regression diagnostic
        if: steps.regression.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/c31-npm-test.log','utf8').slice(-50000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'c31-regression-diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: { title: 'C31 npm test regression tail', summary: 'Diagnostic only; remove after convergence.', text: body }
            });
      - name: Fail on regression
        if: steps.regression.outputs.code != '0'
        run: exit 1
      - name: Run repository check with capture
        id: repo_check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check > /tmp/c31-check.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Publish repository-check diagnostic
        if: steps.repo_check.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/c31-check.log','utf8').slice(-50000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'c31-check-diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: { title: 'C31 repository check tail', summary: 'Diagnostic only; remove after convergence.', text: body }
            });
      - name: Fail on repository check
        if: steps.repo_check.outputs.code != '0'
        run: exit 1
      - run: npm run check:c29
