name: C58 executable lifecycle gate
on:
  pull_request:
    paths:
      - 'src/contract.mjs'
      - 'src/bootstrap-intent-adapter.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime.mjs'
      - 'BOOTSTRAP.json'
      - 'runtime-root/**'
      - 'tests/c58-runtime-lifecycle-gate.test.mjs'
      - 'scripts/c58-runtime-lifecycle-gate-falsify.mjs'
      - 'package.json'
      - 'scripts/c58-host-bootstrap-falsify.c'
      - 'scripts/c58-session-chat-local-prompt-falsify.mjs'
      - 'scripts/c58-composition-audit-10k.mjs'
      - 'plugins/ikant-le-session-chat/server/server.mjs'
      - 'contracts/session-chat-local-host-kernel.json'
      - 'docs/SESSION_CHAT_LOCAL_PROMPT.md'
      - 'src/session-chat-local-prompt.mjs'
      - '.github/workflows/c58-runtime-lifecycle-gate.yml'
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate content-addressed runtime root
        run: npm run runtime-root:regen
      - name: Commit generated runtime root when needed
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- BOOTSTRAP.json runtime-root; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BOOTSTRAP.json runtime-root
            git commit -m "C58: regenerate runtime root"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Focused executable boundary tests
        run: node --test --test-concurrency=1 tests/c42-bootstrap-ontological-closure.test.mjs tests/c57-host-binding-aware-meta.test.mjs tests/c58-runtime-lifecycle-gate.test.mjs
      - name: Ten-thousand composition cleanup mutations
        run: node scripts/c58-composition-audit-10k.mjs > /tmp/c58-composition-10k.json
      - name: Ten-thousand action-kernel adversarial mutations
        run: node scripts/c58-session-chat-local-prompt-falsify.mjs > /tmp/c58-prompt.json
      - name: Ten-million local parser mutations
        run: node scripts/c58-runtime-lifecycle-gate-falsify.mjs --cases 10000000 > /tmp/c58-local-10m.json
      - name: Compile host-bootstrap falsifier
        run: cc -O3 -std=c11 -Wall -Wextra scripts/c58-host-bootstrap-falsify.c -o /tmp/c58-host-falsify
      - name: Ten-million global host-state mutations
        run: /tmp/c58-host-falsify --mode global --cases 10000000 > /tmp/c58-global-10m.json
      - name: One-billion full local-global mutations
        run: /tmp/c58-host-falsify --mode full --cases 1000000000 > /tmp/c58-full-1b.json
      - name: Runtime root verify
        run: npm run runtime-root:verify
      - name: Canonical repository check
        run: npm run check
      - name: Upload C58 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c58-runtime-lifecycle-evidence
          path: |
            /tmp/c58-composition-10k.json
            /tmp/c58-prompt.json
            /tmp/c58-local-10m.json
            /tmp/c58-global-10m.json
            /tmp/c58-full-1b.json
          if-no-files-found: ignore
