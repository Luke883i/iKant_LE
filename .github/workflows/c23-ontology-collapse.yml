name: c23-ontology-collapse
on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'BOOTSTRAP.json'
      - 'ADMISSION.json'
      - 'contracts/host-shell.json'
      - 'contracts/session-chat-activation.json'
      - 'contracts/local-session-fastboot.json'
      - 'contracts/ikant-le.json'
      - 'contracts/chat-bootstrap-semantic.json'
      - 'src/state.mjs'
      - 'src/fastboot-convergence.mjs'
      - 'src/runtime-availability.mjs'
      - 'src/session-chat-deployment.mjs'
      - 'runtime-root/**'
      - 'tests/c23-ontology-collapse.test.mjs'
      - 'scripts/c23-ontology-collapse-falsify.c'
      - 'scripts/check.mjs'
      - 'package.json'
      - 'docs/GOVERNANCE.md'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Diagnose C23 tests
        run: node --test --test-concurrency=1 tests/c23-ontology-collapse.test.mjs
      - name: Diagnose C20 compatibility tests
        run: node --test --test-concurrency=1 tests/c20-session-chat-deployment.test.mjs
      - name: Diagnose C21-C22 tests
        run: node --test --test-concurrency=1 tests/c21-local-session-fastboot.test.mjs
      - name: Diagnose runtime availability tests
        run: node --test --test-concurrency=1 tests/runtime-availability.test.mjs
      - name: Diagnose bootstrap semantic tests
        run: node --test --test-concurrency=1 tests/chat-bootstrap-semantic.test.mjs
      - name: Diagnose runtime tests
        run: node --test --test-concurrency=1 tests/runtime.test.mjs
      - name: Diagnose fastboot tests
        run: node --test --test-concurrency=1 tests/fastboot.test.mjs
      - name: Diagnose first-contact tests
        run: node --test --test-concurrency=1 tests/first-contact.test.mjs
      - name: Diagnose session-chat fastboot tests
        run: node --test --test-concurrency=1 tests/session-chat-fastboot.test.mjs
      - name: Diagnose surface-b tests
        run: node --test --test-concurrency=1 tests/surface-b.test.mjs
      - name: Diagnose C5 tests
        run: node --test --test-concurrency=1 tests/c5.test.mjs
      - name: Diagnose emergence tests
        run: node --test --test-concurrency=1 tests/emergence.test.mjs
      - name: Diagnose life-consciousness tests
        run: node --test --test-concurrency=1 tests/life-consciousness.test.mjs
      - name: Diagnose embedded-library tests
        run: node --test --test-concurrency=1 tests/embedded-library.test.mjs
      - run: npm run qualify:current
