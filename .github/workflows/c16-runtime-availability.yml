name: c16-runtime-availability
on:
  pull_request:
    paths:
      - 'src/runtime-availability.mjs'
      - 'contracts/runtime-availability-dod.json'
      - 'contracts/chat-bootstrap-semantic.json'
      - 'contracts/host-shell.json'
      - 'BOOTSTRAP.json'
      - 'runtime-root/**'
      - 'scripts/c16-runtime-availability-falsify.mjs'
      - 'tests/runtime-availability.test.mjs'
      - 'package.json'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run falsify:c16:discover
      - run: npm run falsify:c16
