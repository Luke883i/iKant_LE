name: C59 single composition channel

on:
  pull_request:
    paths:
      - 'BOOTSTRAP.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'TERMS.md'
      - 'ikant.mjs'
      - 'contracts/session-chat-local-host-kernel.json'
      - 'contracts/session-chat-composition-channel.json'
      - 'contracts/session-chat-composition-census.json'
      - 'contracts/session-chat-executable-surface-registry.json'
      - 'contracts/session-chat-semantic-lattice.json'
      - 'contracts/project-host-rom.json'
      - 'contracts/bootstrap-channel-lineage.json'
      - 'contracts/bootstrap-composition-space.json'
      - 'src/bootstrap-semantic.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime-root-verified.mjs'
      - 'src/runtime.mjs'
      - 'src/state.mjs'
      - 'src/local-host-meta-prompt.mjs'
      - 'src/session-chat-local-prompt.mjs'
      - 'src/session-chat-composition.mjs'
      - 'src/session-chat-deployment.mjs'
      - 'plugins/ikant-le-session-chat/server/server.mjs'
      - 'runtime-root/**'
      - 'docs/SESSION_CHAT_LOCAL_PROMPT.md'
      - 'docs/PROJECT_META_PROMPT_COBOL.md'
      - 'docs/C59_SINGLE_COMPOSITION_CHANNEL.md'
      - 'docs/C59_PR1_68_LINEAGE_AUDIT.md'
      - 'tests/bootstrap-fixture.mjs'
      - 'tests/c58-runtime-lifecycle-gate.test.mjs'
      - 'tests/c59-single-composition.test.mjs'
      - 'tests/c59-canonical-authority-gate.test.mjs'
      - 'tests/c59-runtime-dominator.test.mjs'
      - 'tests/c59-project-host-rom.test.mjs'
      - 'tests/c59-orientation-closure.test.mjs'
      - 'scripts/c58-composition-audit-10k.mjs'
      - 'scripts/c58-session-chat-local-prompt-falsify.mjs'
      - 'scripts/c59-pr-history-audit.mjs'
      - 'scripts/c59-cartesian-closure.mjs'
      - 'scripts/c59-canonical-authority-falsify.mjs'
      - 'scripts/c59-render-pr-lineage.mjs'
      - 'scripts/c59-executable-surface-audit.mjs'
      - 'scripts/c59-semantic-lattice-select.mjs'
      - 'scripts/c59-runtime-closure-falsify-100k.mjs'
      - 'scripts/render-project-host-rom.mjs'
      - 'artifacts/qualification/c59-*'
      - '.github/workflows/c59-single-composition.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: C58/C59 lifecycle/prompt boundary
        run: node --test --test-concurrency=1 tests/c58-runtime-lifecycle-gate.test.mjs
      - name: C59 composition contract closure
        if: always()
        run: node --test --test-concurrency=1 tests/c59-single-composition.test.mjs
      - name: C59 canonical authority gate
        if: always()
        run: node --test --test-concurrency=1 tests/c59-canonical-authority-gate.test.mjs
      - name: C59 materialized runtime dominator
        if: always()
        run: node --test --test-concurrency=1 tests/c59-runtime-dominator.test.mjs
      - name: C59 Project ROM parity
        if: always()
        run: node --test --test-concurrency=1 tests/c59-project-host-rom.test.mjs
      - name: C59 orientation closure
        if: always()
        run: node --test --test-concurrency=1 tests/c59-orientation-closure.test.mjs
      - name: C59 10k composition audit
        run: node scripts/c58-composition-audit-10k.mjs
      - name: C59 10k prompt mutations
        run: node scripts/c58-session-chat-local-prompt-falsify.mjs
      - name: C59 Project ROM exact renderer
        run: |
          node scripts/render-project-host-rom.mjs > /tmp/c59-project-rom.md
          diff -u docs/PROJECT_META_PROMPT_COBOL.md /tmp/c59-project-rom.md
      - name: C59 PR1-68 history closure
        run: |
          node scripts/c59-pr-history-audit.mjs > /tmp/c59-history.json
          diff -u artifacts/qualification/c59-pr1-68-history-audit.json /tmp/c59-history.json
      - name: C59 historical Cartesian quotient closure
        run: |
          node scripts/c59-cartesian-closure.mjs > /tmp/c59-cartesian.json
          diff -u artifacts/qualification/c59-cartesian-closure.json /tmp/c59-cartesian.json
      - name: C59 generated unitary PR audit
        run: |
          node scripts/c59-render-pr-lineage.mjs > /tmp/c59-lineage.md
          diff -u docs/C59_PR1_68_LINEAGE_AUDIT.md /tmp/c59-lineage.md
      - name: C59 canonical handoff 100k mutations
        run: |
          node scripts/c59-canonical-authority-falsify.mjs > /tmp/c59-authority.json
          diff -u artifacts/qualification/c59-canonical-authority-falsification-100k.json /tmp/c59-authority.json
      - name: C59 closed executable surface audit
        run: |
          node scripts/c59-executable-surface-audit.mjs > /tmp/c59-executable.json
          diff -u artifacts/qualification/c59-executable-surface-audit.json /tmp/c59-executable.json
      - name: C59 minimum 2^12 semantic lattice
        run: |
          node scripts/c59-semantic-lattice-select.mjs > /tmp/c59-lattice.json
          diff -u artifacts/qualification/c59-semantic-lattice-selection-4k.json /tmp/c59-lattice.json
      - name: C59 runtime closure 100k mutations
        run: |
          node scripts/c59-runtime-closure-falsify-100k.mjs > /tmp/c59-runtime-closure.json
          diff -u artifacts/qualification/c59-runtime-closure-falsification-100k.json /tmp/c59-runtime-closure.json
      - name: Runtime root exact and current
        run: npm run runtime-root:verify
      - name: Repository check
        run: npm run check
