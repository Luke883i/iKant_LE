name: C98 Project baseline - two-object negative proof
on:
  pull_request:
    paths:
      - 'project-baseline/**'
      - 'contracts/c98-project-2object-baseline.json'
      - 'host/c98-project-boundary-observer.mjs'
      - 'tests/c98-project-baseline.test.mjs'
      - 'scripts/c98-project-boundary-100k.mjs'
      - '.github/workflows/c98-project-3md.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-baseline:
    name: Node ${{ matrix.node }} baseline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: source-bound diagnostic contract
        run: node --test tests/c98-project-baseline.test.mjs
      - name: 100000 real local negative model cases
        run: node scripts/c98-project-boundary-100k.mjs 100000
