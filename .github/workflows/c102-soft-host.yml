name: C102 original local host soft bridge qualification
on:
  pull_request:
    paths:
      - 'host/c102-soft-host-bridge.mjs'
      - 'scripts/c102-soft-host-cli.mjs'
      - 'test/c102-real-source.test.mjs'
      - 'docs/C102_SOFT_HOST_RUNTIME.md'
      - '.github/workflows/c102-soft-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-node-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source graph and host adapter syntax
        run: |
          node --check host/c102-soft-host-bridge.mjs
          node --check scripts/c102-soft-host-cli.mjs
      - name: Execute original C101 cognitive chain through original C87 ledger
        run: node --test test/c102-real-source.test.mjs
