name: C107 one source-exact carrier release
on:
  push:
    branches:
      - prepr/c107-single-carrier-v8
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out exact pinned original source
        run: git worktree add --detach "$RUNNER_TEMP/ikant-original" c734bf934e33703a6a1f91f0f4d5df96eec96945
      - name: Execute original C107 and current topic guard tests
        run: |
          cd "$RUNNER_TEMP/ikant-original"
          node --test tests/c107-original.test.mjs tests/c115-topic-routing.test.mjs
      - name: Build deterministic single binary carrier
        run: |
          node scripts/release-c107-onefile.mjs "$RUNNER_TEMP/ikant-original"
          echo "d17195881d6567524f1cdf358c991be5ff0d68e92aea2ba14273f0ea2cf74c6d  release/v8/ikant-c107-source-c734bf934e33.ikc.br" | sha256sum -c -
      - name: Record exactly one release payload in own commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- release/v8/ikant-c107-source-c734bf934e33.ikc.br
          if git diff --cached --quiet; then
            echo "Already published; refusing redundant release commit."
            exit 0
          fi
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "release(c107): pin one 62448-byte original source carrier"
          git push origin HEAD:prepr/c107-single-carrier-v8
