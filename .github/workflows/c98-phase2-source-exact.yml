name: C98 phase 2 - source-exact carrier C82 C84, offline boundary and H95
on:
  pull_request:
    paths:
      - 'host/c98-h95-design.mjs'
      - 'host/c98-chatgpt-offline-boundary.mjs'
      - 'host/c98-c82-connector-port.mjs'
      - 'host/c98-archive-c82-port.mjs'
      - 'host/c98-existing-c84-entry.mjs'
      - 'tests/c98-h95-design.test.mjs'
      - 'tests/c98-offline-preflight-selfcontained.test.mjs'
      - 'tests/c98-c82-port.test.mjs'
      - 'tests/c98-archive-port.test.mjs'
      - 'tests/c98-entry-negative.test.mjs'
      - 'contracts/c98-h95-field-protocol.json'
      - 'scripts/c98-h95-plan.mjs'
      - '.github/workflows/c98-phase2-source-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run exact C98 core adapter against existing C82 C84 C94 source
        run: node --test --test-concurrency=1 tests/c98-c82-port.test.mjs tests/c98-archive-port.test.mjs tests/c98-entry-negative.test.mjs
      - name: Exercise original C98 field and offline tests with source C80 C72
        run: node --test tests/c98-h95-design.test.mjs tests/c98-offline-preflight-selfcontained.test.mjs tests/c80-field-witness.test.mjs tests/c72-product-value.test.mjs
      - name: Execute C98 planning on repository C72 policy
        run: node scripts/c98-h95-plan.mjs > /tmp/c98-plan.json
      - name: Preserve prior merged C98 3MD baseline regression
        run: |
          node --test tests/c98-project-baseline.test.mjs
          node scripts/c98-project-boundary-100k.mjs 100000
