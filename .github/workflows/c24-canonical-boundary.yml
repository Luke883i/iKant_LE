name: c24-canonical-boundary
on:
  pull_request:
    paths:
      - '**'
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: runtime-root verify
        run: npm run runtime-root:verify
      - name: repository tests
        run: npm test
      - name: canonical check
        run: npm run check
      - name: C27 semantic falsification
        run: npm run falsify:c27
      - name: legacy canonical hardening
        run: npm run falsify:c21 && npm run falsify:c22 && npm run falsify:c23 && npm run falsify:c24 && npm run falsify:c25 && npm run falsify:host-meta
