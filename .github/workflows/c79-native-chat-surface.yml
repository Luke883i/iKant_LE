name: C79 ordinary chat Surface A consumption and mutation gates
on:
  pull_request:
    paths:
      - 'host/c79-*'
      - 'scripts/c79-*'
      - 'tests/c79-*'
      - 'contracts/c79-*'
      - 'docs/C79_*'
      - '.github/workflows/c79-native-chat-surface.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-chat-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Real C78 subprocess, C79 exact native-chat packet, 2000 mutants
        run: node --test --test-concurrency=1 tests/c79-native-chat-surface.test.mjs
      - name: C78 original relay and 160 mutations
        run: node --test --test-concurrency=1 tests/c78-host-relay.test.mjs
      - run: npm run runtime-root:verify
      - run: npm run check
