name: C57 scope-safe host binding
on:
  pull_request:
    paths:
      - 'src/local-host-meta-prompt.mjs'
      - 'docs/LOCAL_HOST_META_PROMPT.md'
      - 'docs/C57_HOST_BINDING_AWARE_META_PROMPT.md'
      - 'contracts/local-host-binding-aware-meta-prompt.json'
      - 'tests/local-host-meta-prompt.test.mjs'
      - 'tests/c55-local-host-post-meta.test.mjs'
      - 'tests/c56-local-host-session-meta.test.mjs'
      - 'tests/c57-host-binding-aware-meta.test.mjs'
      - 'scripts/c57-host-binding-meta-falsify.mjs'
      - '.github/workflows/c57-host-binding-aware-meta.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check src/local-host-meta-prompt.mjs
          node --check scripts/c57-host-binding-meta-falsify.mjs
      - name: Focused inherited prompt tests
        run: node --test --test-concurrency=1 tests/local-host-meta-prompt.test.mjs tests/c44-methodological-bootstrap.test.mjs tests/c55-local-host-post-meta.test.mjs tests/c56-local-host-session-meta.test.mjs tests/c57-host-binding-aware-meta.test.mjs
      - name: Scope-binding semantic falsification and complete 2^4 lattice
        run: node scripts/c57-host-binding-meta-falsify.mjs --cases 100000 > /tmp/c57.json
      - name: Assert C57 semantic evidence
        run: |
          node -e "const x=require('/tmp/c57.json');if(x.status!=='PASS'||x.cases!==100000||x.candidate_oracle_mismatches!==0||x.unsafe_promotions!==0||x.false_rejects!==0||x.architecture_lattice?.total!==16||x.architecture_lattice?.unique_minimum!==true||x.architecture_lattice?.minimum_cost!==4||x.all_deletion_mutants_killed!==true||x.all_prompt_polarity_mutants_killed!==true)process.exit(1)"
      - name: Canonical repository qualification
        run: npm run check
      - name: Runtime root unchanged
        run: npm run runtime-root:verify
