name: C10 fastboot qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-c10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deterministic regression
        run: npm test
      - name: Contract check
        run: npm run check
      - name: C10 one-million fastboot mutations
        run: npm run falsify:c10
      - name: Verify C10 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/qualification/c10-fastboot.json','utf8'));
          if(r.status!=='PASS' || r.cases!==1_000_000 || r.survivors!==0) throw new Error('C10 qualification mismatch');
          if(r.categories.typical!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('C10 strata mismatch');
          if(r.family_count!==40 || r.positive_control_failures!==0 || r.novel_signatures_in_tail!==0) throw new Error('C10 family/no-novelty mismatch');
          if(r.minimal_zero_violation_sets.length!==1 || r.minimal_zero_violation_sets[0].length!==6) throw new Error('C10 minimal lattice mismatch');
          if(r.claim_boundary.mutation_proves_wall_clock_latency!==false || r.claim_boundary.mutation_proves_universal_host_parallelism!==false) throw new Error('C10 claim boundary missing');
          console.log(`IKANT_LE_C10_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C10_RECEIPT=${r.receipt_sha256}`);
          NODE
