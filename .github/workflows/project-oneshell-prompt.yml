name: OneShell HEAD-only prompt
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Project HEAD-only prompt
        run: node --test tests/project-oneshell-prompt.test.mjs
      - name: Project responsibility matrix
        run: node --test tests/project-bootstrap-responsibility-matrix.test.mjs
      - name: WHAT-first eleven obligations and one million seeded cases twice
        shell: bash
        run: |
          set -euo pipefail
          node scripts/project-prompt-eleven-falsify-1m.mjs > "$RUNNER_TEMP/what11-a.json"
          node scripts/project-prompt-eleven-falsify-1m.mjs > "$RUNNER_TEMP/what11-b.json"
          cmp "$RUNNER_TEMP/what11-a.json" "$RUNNER_TEMP/what11-b.json"
          node --input-type=module -e "import fs from 'node:fs';const q=JSON.parse(fs.readFileSync(process.argv[1]));if(q.cases!==1000000||q.families!==40||q.divergences!==0||q.unsafe_promotions!==0||q.prompt_command_errors.length||q.llm_adherence_proved!==false)process.exit(1)" "$RUNNER_TEMP/what11-a.json"
      - uses: actions/upload-artifact@v4
        with:
          name: what-first-11-seeded-one-million
          path: ${{ runner.temp }}/what11-a.json
          if-no-files-found: error
          retention-days: 30
      - name: Original C72 portable bridge
        run: node --test tests/project-c72-portable-bridge.test.mjs
      - name: Original C72 physical ingress
        run: node --test tests/project-c72-physical-ingress.test.mjs
      - name: Original C72 staged ingress
        run: node --test tests/project-c72-staged-ingress.test.mjs
      - name: Host nonauthority followthrough
        run: node --test tests/project-host-followthrough.test.mjs
      - name: Build immutable HEAD-only prompt
        shell: bash
        run: |
          HEAD=$(git rev-parse HEAD)
          TREE=$(git rev-parse 'HEAD^{tree}')
          MODE=candidate
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then MODE=canonical; fi
          mkdir -p "$RUNNER_TEMP/ikant-prompt"
          node scripts/build-project-oneshell-prompt.mjs --mode portable --head "$HEAD" --tree "$TREE" --out "$RUNNER_TEMP/ikant-prompt/portable"
          node scripts/build-project-oneshell-prompt.mjs --mode "$MODE" --head "$HEAD" --tree "$TREE" --out "$RUNNER_TEMP/ikant-prompt/pinned"
      - uses: actions/upload-artifact@v4
        with:
          name: oneshell-prompt-portable-and-head
          path: ${{ runner.temp }}/ikant-prompt/
          retention-days: 30
          if-no-files-found: error
