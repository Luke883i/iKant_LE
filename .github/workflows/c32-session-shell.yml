name: C32 deterministic session shell
on:
  push:
    branches: ['c31/deterministic-session-shell-prepr']
  pull_request:
permissions:
  contents: read
jobs:
  c32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run runtime-root:verify
      - run: node --test --test-concurrency=1 tests/c32-session-shell.test.mjs tests/c31-runtime-limited-supply-chain.test.mjs tests/c30-activation-service.test.mjs
      - run: npm run select:c32
      - run: npm run falsify:c32
      - run: npm test
      - run: npm run check
      - run: npm run check:c29
