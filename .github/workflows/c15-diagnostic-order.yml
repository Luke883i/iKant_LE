name: C15 diagnostic ordered state
on:
  pull_request:
    branches: [main]
jobs:
  diagnose-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 01-c5
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/c5.test.mjs
      - name: 02-chat-bootstrap-semantic
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/chat-bootstrap-semantic.test.mjs
      - name: 03-embedded-library
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/embedded-library.test.mjs
      - name: 04-emergence
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/emergence.test.mjs
      - name: 05-fastboot
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/fastboot.test.mjs
      - name: 06-first-contact
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/first-contact.test.mjs
      - name: 07-life-consciousness
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/life-consciousness.test.mjs
      - name: 08-runtime
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/runtime.test.mjs
      - name: 09-session-chat-fastboot
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/session-chat-fastboot.test.mjs
      - name: 10-surface-b
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/surface-b.test.mjs
      - name: exact-npm-test
        continue-on-error: true
        run: npm test
