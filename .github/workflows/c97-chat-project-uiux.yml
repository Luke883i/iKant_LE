name: C97 Project Chat deterministic UIUX projection
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c97:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: C97 and existing C32 C73 owner regressions
        run: node --test tests/c97-uiux-projection.test.mjs tests/c32-session-shell.test.mjs tests/c73-project-capsule.test.mjs
      - name: Source and lifecycle contract check
        run: npm run check
