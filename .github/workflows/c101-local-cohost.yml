name: C101 local cohost machine qualification
on:
  pull_request:
    paths:
      - 'host/c101-local-cohost-machine.mjs'
      - 'scripts/c101-*'
      - 'test/c101-local-machine.test.mjs'
      - 'contracts/c101-local-cohost-machine.json'
      - '.github/workflows/c101-local-cohost.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source original integration test
        run: node --test test/c101-local-machine.test.mjs
      - name: One hundred thousand negative mutations and thirty thousand scenarios
        run: |
          node scripts/c101-falsify-130k.mjs > c101-campaign.json
          node -e 'const r=require("./c101-campaign.json");if(!r.qualified||r.synthetic_scenarios!==130000||r.negative_mutations!==100000||r.actual_full_c70_c71_c100_runs!==100||r.unexpected_survivors)process.exit(2);console.log(JSON.stringify(r));'
