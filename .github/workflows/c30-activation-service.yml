name: C30 activation service
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm run select:c30
      - run: npm run falsify:c30
  tiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 --test-name-pattern="service tiers" tests/c30-activation-service.test.mjs
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 --test-name-pattern="integrity overlay" tests/c30-activation-service.test.mjs
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 --test-name-pattern="limited closure" tests/c30-activation-service.test.mjs
  docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 --test-name-pattern="mechanically closes" tests/c30-activation-service.test.mjs
  noncanonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 --test-name-pattern="no canonical writer" tests/c30-activation-service.test.mjs
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 --test-name-pattern="checked-in selection" tests/c30-activation-service.test.mjs
  c28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 tests/c28-semantic-closure.test.mjs
  c29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 tests/c29-ontological-promise.test.mjs
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 tests/c30-activation-service.test.mjs tests/c28-semantic-closure.test.mjs tests/c29-ontological-promise.test.mjs
      - run: npm run runtime-root:verify
