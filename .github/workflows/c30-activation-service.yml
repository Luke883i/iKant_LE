name: C30 activation service
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c30:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select activation service contract
        run: npm run select:c30
      - name: Falsify activation service 10m
        run: npm run falsify:c30
      - name: Prefix 1
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern="service tiers" tests/c30-activation-service.test.mjs
      - name: Prefix 2
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern="service tiers|integrity overlay" tests/c30-activation-service.test.mjs
      - name: Prefix 3
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern="service tiers|integrity overlay|limited closure" tests/c30-activation-service.test.mjs
      - name: Prefix 4
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern="service tiers|integrity overlay|limited closure|mechanically closes" tests/c30-activation-service.test.mjs
      - name: Prefix 5
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern="service tiers|integrity overlay|limited closure|mechanically closes|no canonical writer" tests/c30-activation-service.test.mjs
      - name: Prefix 6
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/c30-activation-service.test.mjs
      - name: C30 focused aggregate
        run: node --test --test-concurrency=1 tests/c30-activation-service.test.mjs
      - name: Verify runtime root
        run: npm run runtime-root:verify
