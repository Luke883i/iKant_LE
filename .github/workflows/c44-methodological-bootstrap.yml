name: C44 methodological bootstrap
on:
  pull_request:
    paths:
      - 'BOOTSTRAP.json'
      - 'src/local-host-meta-prompt.mjs'
      - 'src/session-shell.mjs'
      - 'contracts/session-shell.json'
      - 'contracts/methodological-bootstrap.json'
      - 'stile_comunicativo.md'
      - 'scripts/c44-methodological-bootstrap-select.mjs'
      - 'scripts/c44-methodological-bootstrap-falsify.mjs'
      - 'tests/c44-methodological-bootstrap.test.mjs'
      - 'runtime-root/shard-003.json'
      - 'runtime-root/shard-004.json'
      - 'package.json'
jobs:
  c44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run select:c44
      - run: npm run falsify:c44
      - run: node --test tests/c44-methodological-bootstrap.test.mjs
      - run: npm run runtime-root:verify
      - run: npm run check
