name: c21-local-session-fastboot
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    paths:
      - 'BOOTSTRAP.json'
      - 'AGENTS.md'
      - 'contracts/local-session-fastboot.json'
      - 'contracts/session-chat-activation.json'
      - 'contracts/host-shell.json'
      - 'contracts/ikant-le.json'
      - 'contracts/chat-bootstrap-semantic.json'
      - 'src/fastboot-convergence.mjs'
      - 'src/probe.mjs'
      - 'src/runtime-core.mjs'
      - 'src/runtime-command.mjs'
      - 'src/runtime.mjs'
      - 'src/state.mjs'
      - 'runtime-root/**'
      - 'tests/c21-local-session-fastboot.test.mjs'
      - 'scripts/c21-local-session-fastboot-falsify.c'
      - 'scripts/check.mjs'
      - 'package.json'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run npm test with diagnostic capture
        id: npm_test
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/npm-test.log" 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -c 12000 "$RUNNER_TEMP/npm-test.log" > "$RUNNER_TEMP/npm-test-tail.log"
          exit 0
      - name: Report npm test failure
        if: steps.npm_test.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = 'C21 diagnostic — npm test failed on ' + context.sha + '\n\n```text\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/npm-test-tail.log','utf8') + '\n```';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Fail after diagnostic
        if: steps.npm_test.outputs.code != '0'
        run: exit 1
      - run: npm run check
      - run: npm run falsify:c15
      - run: npm run falsify:c17
      - run: npm run falsify:c18
      - run: npm run falsify:c19
      - run: npm run falsify:c21
