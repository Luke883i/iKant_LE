name: C38 debug test isolation
on:
  pull_request:
    branches: [main]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-concurrency=1 tests/runtime.test.mjs tests/c5.test.mjs tests/emergence.test.mjs tests/life-consciousness.test.mjs tests/surface-b.test.mjs
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-concurrency=1 tests/first-contact.test.mjs tests/fastboot.test.mjs tests/chat-bootstrap-semantic.test.mjs tests/session-chat-fastboot.test.mjs tests/runtime-availability.test.mjs
  c17_c25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-concurrency=1 tests/c17-deadline-integrity.test.mjs tests/c18-activation-continuation.test.mjs tests/c19-fastboot-convergence.test.mjs tests/c20-session-chat-deployment.test.mjs tests/c21-local-session-fastboot.test.mjs tests/c23-ontology-collapse.test.mjs tests/c24-canonical-boundary.test.mjs tests/c25-executor-data-plane.test.mjs
  c27_c34:
