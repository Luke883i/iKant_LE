name: C38 debug test isolation
on:
  pull_request:
    branches: [main]
jobs:
  bounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-name-pattern="self-world state stays bounded under 100 turns" tests/c5.test.mjs
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-name-pattern="C5 state embeds bounded self-world projection" tests/c5.test.mjs
  c4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-name-pattern="C4 telemetry decomposition" tests/c5.test.mjs
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-name-pattern="backlog v6 exposes" tests/c5.test.mjs
