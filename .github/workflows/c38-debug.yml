name: C38 debug test isolation
on:
  pull_request:
    branches: [main]
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test --test-concurrency=1 tests/runtime.test.mjs
  c5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
