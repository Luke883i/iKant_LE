name: C84 temporary CI error witness
on:
  pull_request:
    paths:
      - '.github/workflows/c84-ci-error-witness.yml'
permissions:
  contents: read
  contents: write
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run original failing commands and disclose bounded diagnostics
        run: |
          set +e
          npm test > /tmp/c84-npm-test.log 2>&1
          TEST_EXIT=$?
          node scripts/c59-executable-surface-audit.mjs > /tmp/c84-c59-actual.json 2>&1
          AUDIT_EXIT=$?
          diff -u artifacts/qualification/c59-executable-surface-audit.json /tmp/c84-c59-actual.json > /tmp/c84-c59-diff.txt 2>&1
          DIFF_EXIT=$?
          {
            echo '### C84 controlled failure witness'
            echo "npm test exit: $TEST_EXIT; C59 audit exit: $AUDIT_EXIT; C59 artifact diff exit: $DIFF_EXIT."
            echo
            echo '#### npm test failed-case excerpts'
            echo '~~~'
            grep -n -A 18 '^not ok\|^# not ok' /tmp/c84-npm-test.log | head -n 200 || true
            echo '~~~'
            echo '#### npm test tail'
            echo '~~~'
            tail -n 40 /tmp/c84-npm-test.log || true
            echo '~~~'
            echo '#### C59 audit errors'
            echo '~~~'
            tail -n 55 /tmp/c84-c59-actual.json || true
            echo '~~~'
            echo '#### C59 expected artifact diff'
            echo '~~~'
            head -n 85 /tmp/c84-c59-diff.txt || true
            echo '~~~'
            echo
            echo 'Diagnostic only; does not waive any existing qualification.'
          } > /tmp/c84-error-witness.md
          cp /tmp/c84-error-witness.md artifacts/qualification/c84-ci-witness.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/qualification/c84-ci-witness.md
          git commit -m "C84 temporary diagnostic receipt from actual CI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
