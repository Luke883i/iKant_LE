name: iKant_LE qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deterministic tests
        run: npm test
      - name: Contract and lifecycle check
        run: npm run check
      - name: C3 one-million runtime semantic falsification
        run: npm run falsify:c3
      - name: Verify C3 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/qualification/c3-runtime.json','utf8'));
          if(r.status!=='PASS') throw new Error('C3 qualification not PASS');
          if(r.main.cases!==1_000_000 || r.main.survivors!==0) throw new Error('1M mismatch');
          if(r.main.categories.ordinary!==500_000 || r.main.categories.edge!==300_000 || r.main.categories.stress!==200_000) throw new Error('strata mismatch');
          if(r.claim_boundary.mutation_is_host_behavior_proof!==false) throw new Error('claim boundary missing');
          console.log(`IKANT_LE_C3_RECEIPT=${r.receipt_sha256}`);
          NODE
