name: iKant_LE qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deterministic tests
        run: npm test
      - name: Contract and lifecycle check
        run: npm run check
      - name: C5 one-million recurrent self-world semantic falsification
        run: npm run falsify:c5
      - name: Verify C5 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/qualification/c5-runtime.json','utf8'));
          if(r.status!=='PASS') throw new Error('C5 qualification not PASS');
          if(r.cases!==1_000_000 || r.survivors!==0) throw new Error('1M mismatch');
          if(r.categories.ordinary!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('strata mismatch');
          if(r.family_count!==40 || r.family_violations.length!==0) throw new Error('family mismatch');
          if(r.claim_boundary.consciousness_proof!==false || r.claim_boundary.biological_equivalence_proof!==false || r.claim_boundary.iit_phi_proof!==false) throw new Error('claim boundary missing');
          console.log(`IKANT_LE_C5_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C5_RECEIPT=${r.receipt_sha256}`);
          NODE
