name: iKant_LE qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deterministic tests
        run: npm test
      - name: Contract and lifecycle check
        run: npm run check
      - name: C5 one-million recurrent self-world semantic falsification
        run: npm run falsify:c5
      - name: Verify C5 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/qualification/c5-runtime.json','utf8'));
          if(r.status!=='PASS') throw new Error('C5 qualification not PASS');
          if(r.cases!==1_000_000 || r.survivors!==0) throw new Error('1M mismatch');
          if(r.categories.ordinary!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('strata mismatch');
          if(r.family_count!==40 || r.family_violations.length!==0) throw new Error('family mismatch');
          if(r.claim_boundary.consciousness_proof!==false || r.claim_boundary.biological_equivalence_proof!==false || r.claim_boundary.iit_phi_proof!==false) throw new Error('claim boundary missing');
          console.log(`IKANT_LE_C5_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C5_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C6 one-million end-user first-contact qualification
        run: npm run falsify:c6
      - name: Verify C6 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/qualification/c6-enduser.json','utf8'));
          if(r.status!=='PASS') throw new Error('C6 qualification not PASS');
          if(r.cases!==1_000_000) throw new Error('C6 case count mismatch');
          if(r.categories.typical!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('C6 strata mismatch');
          if(r.families_exercised!==288 || r.violations.length!==0) throw new Error('C6 family/violation mismatch');
          if(r.claim_boundary.mutation_proves_conforming_host_behavior!==false || r.claim_boundary.mutation_proves_universal_agent_compliance!==false) throw new Error('C6 claim boundary missing');
          console.log(`IKANT_LE_C6_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C6_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C7 one-million documentation and API-transport qualification
        run: npm run falsify:c7
      - name: Verify C7 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/qualification/c7-doc-api.json','utf8'));
          if(r.status!=='PASS') throw new Error('C7 qualification not PASS');
          if(r.cases!==1_000_000 || r.survivors!==0) throw new Error('C7 1M mismatch');
          if(r.categories.typical!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('C7 strata mismatch');
          if(r.family_count!==41 || r.unexercised_families.length!==0 || r.violations.length!==0) throw new Error('C7 family/violation mismatch');
          if(r.documentation.as_is_bytes!==61013 || r.documentation.to_be_bytes>25000 || r.documentation.reduction_ratio<0.60) throw new Error('C7 compression boundary');
          if(r.claim_boundary.mutation_proves_document_semantic_perfection!==false || r.claim_boundary.mutation_proves_universal_host_compliance!==false || r.claim_boundary.mutation_proves_api_availability!==false) throw new Error('C7 claim boundary missing');
          console.log(`IKANT_LE_C7_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C7_RECEIPT=${r.receipt_sha256}`);
          NODE
